name: spark-codespaces-lab
x-spark-common: &spark-common
  image: apache/spark:4.0.5-python3
  init: true
  environment: &spark-env
    SPARK_LOCAL_DIRS: /tmp/spark-local
    PYSPARK_PYTHON: python3
    PYSPARK_DRIVER_PYTHON: python3
    SPARK_DAEMON_MEMORY: 256m
  volumes:
    - ./apps:/lab/apps:ro
    - ./data:/lab/data:ro
    - ./output:/lab/output
  networks: [spark-net]
services:
  spark-master:
    <<: *spark-common
    hostname: spark-master
    entrypoint: [/opt/spark/bin/spark-class]
    command: [org.apache.spark.deploy.master.Master, --host, spark-master, --port, '7077', --webui-port, '8080']
    ports: ['8080:8080']
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8080/json/', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
  spark-worker-1:
    <<: *spark-common
    hostname: spark-worker-1
    entrypoint: [/opt/spark/bin/spark-class]
    command: [org.apache.spark.deploy.worker.Worker, --host, spark-worker-1, --cores, '1', --memory, 1g, --webui-port, '8081', --work-dir, /tmp/spark-work, 'spark://spark-master:7077']
    ports: ['8081:8081']
    depends_on:
      spark-master: {condition: service_healthy}
  spark-worker-2:
    <<: *spark-common
    hostname: spark-worker-2
    entrypoint: [/opt/spark/bin/spark-class]
    command: [org.apache.spark.deploy.worker.Worker, --host, spark-worker-2, --cores, '1', --memory, 1g, --webui-port, '8081', --work-dir, /tmp/spark-work, 'spark://spark-master:7077']
    ports: ['8082:8081']
    depends_on:
      spark-master: {condition: service_healthy}
  spark-client:
    <<: *spark-common
    hostname: spark-client
    working_dir: /lab
    entrypoint: [/bin/bash, -lc]
    command: ['exec sleep infinity']
    ports: ['4040:4040']
    depends_on:
      spark-master: {condition: service_healthy}
networks:
  spark-net: {}
